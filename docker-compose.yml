services:
  tsp:
    build: .
    image: xingtu-tsp:0.1.0
    container_name: xingtu-tsp
    ports:
      - "8090:8090"       # HTTP console + REST + WebSocket
      - "18080:18080"     # JT/T 808 TCP gateway
      - "19000:19000/udp" # JT/T 1078 media UDP
    environment:
      TSP_BIND: 0.0.0.0:8090
      TSP_JT808_ADDR: 0.0.0.0:18080
      TSP_DATABASE: /data/tsp.db
      TSP_JWT_SECRET: change-me-in-production
      TSP_DEMO_MODE: "true"
      TSP_TIMESERIES_BACKEND: ${TSP_TIMESERIES_BACKEND:-postgres}
      TSP_TDENGINE_URL: ${TSP_TDENGINE_URL:-}
      TSP_TDENGINE_QUEUE_CAPACITY: "8192"
      TSP_TDENGINE_WRITE_RETRIES: "3"
      TSP_TDENGINE_SPOOL_DIR: /data/tdengine-spool
      TSP_TDENGINE_SPOOL_MAX_FILES: "100000"
      TSP_TDENGINE_SPOOL_REPLAY_SECS: "60"
      TSP_TIMESERIES_RECONCILE_ENABLED: "true"
      TSP_TIMESERIES_RECONCILE_SECS: "300"
      TSP_TIMESERIES_RECONCILE_WINDOW_MINUTES: "15"
      TSP_TIMESERIES_RECONCILE_MAX_VEHICLES: "100"
      TSP_TIMESERIES_RECONCILE_HISTORY_DAYS: "90"
      TSP_RECONCILE_EXPORT_DIR: /data/reconcile-exports
      TSP_RECONCILE_ALERT_WEBHOOK: ${TSP_RECONCILE_ALERT_WEBHOOK:-}
      TSP_RECONCILE_ALERT_COOLDOWN_SECS: "300"
      TSP_RECONCILE_ALERT_COOLDOWN_SCOPE: ${TSP_RECONCILE_ALERT_COOLDOWN_SCOPE:-global}
      TSP_RECONCILE_ALERT_RETRIES: "2"
      TSP_RECONCILE_ALERT_FORMAT: ${TSP_RECONCILE_ALERT_FORMAT:-generic}
      TSP_RECONCILE_ALERT_MODE: ${TSP_RECONCILE_ALERT_MODE:-per_vehicle}
      TSP_RECONCILE_ALERT_WEBHOOK_SECRET: ${TSP_RECONCILE_ALERT_WEBHOOK_SECRET:-}
      TSP_MEDIA_UDP_ADDR: 0.0.0.0:19000
      TSP_RUSTFS_ARCHIVE: "true"
      TSP_RUSTFS_ENDPOINT: http://rustfs:9000
      TSP_RUSTFS_BUCKET: tsp-media
      TSP_RUSTFS_REGION: us-east-1
      TSP_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      TSP_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      TSP_RUSTFS_PREFIX: media
      TSP_RUSTFS_SEGMENT_SECS: "30"
      TSP_RUSTFS_SEGMENT_MAX_BYTES: "67108864"
      TSP_RUSTFS_UPLOAD_RETRIES: "3"
      TSP_RUSTFS_UPLOAD_TIMEOUT_SECS: "30"
      TSP_RUSTFS_UPLOAD_CONCURRENCY: "4"
      TSP_RUSTFS_RETENTION_DAYS: "0"
      TSP_RUSTFS_CLEANUP_INTERVAL_SECS: "3600"
      TSP_ARCHIVE_PLAYBACK_CACHE_ITEMS: "8"
      TSP_ARCHIVE_PLAYBACK_CACHE_BYTES: "67108864"
      TSP_ARCHIVE_SPOOL_DIR: /data/archive-spool
      TSP_ARCHIVE_SPOOL_REPLAY_SECS: "60"
      TSP_ARCHIVE_SPOOL_MAX_BYTES: "1073741824"
      RUST_LOG: xingtu_tsp=info
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - tsp-data:/data
    restart: unless-stopped

  # Optional TDengine 3.x for larger trajectories. Enable with:
  #   docker compose --profile tdengine up -d
  tdengine:
    image: tdengine/tdengine:3.3.6.0
    container_name: xingtu-tdengine
    profiles: ["tdengine"]
    ports:
      - "6030:6030"
      - "6041:6041"
    environment:
      TAOS_FQDN: tdengine
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'show databases' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # S3-compatible object storage for recorded 1078 media.
  # The app uploads raw H.264/AAC segments when TSP_RUSTFS_ARCHIVE=true.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: xingtu-rustfs
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"       # S3 API
      - "9001:9001"       # RustFS console
    environment:
      RUSTFS_VOLUMES: /data/rustfs0,/data/rustfs1,/data/rustfs2,/data/rustfs3
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
      - rustfs-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # RustFS runs as UID/GID 10001. Named volumes start root-owned, so fix
  # ownership once before the server starts.
  rustfs-permissions:
    image: alpine:3.20
    command: >
      sh -c "chown -R 10001:10001 /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3 /app/logs &&
      echo 'rustfs volume permissions ready'"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
      - rustfs-logs:/app/logs
    restart: "no"

volumes:
  tsp-data:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
  rustfs-logs:
  tdengine-data:
  tdengine-log:
