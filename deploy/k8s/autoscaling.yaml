apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsp-api
  namespace: xingtu-tsp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsp-api
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsp-jt808
  namespace: xingtu-tsp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsp-jt808
  minReplicas: 3
  maxReplicas: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 10
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Add a custom metric such as xingtu_jt808_connections for real gateway scaling.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tsp-api
  namespace: xingtu-tsp
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tsp-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tsp-jt808
  namespace: xingtu-tsp
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tsp-jt808
