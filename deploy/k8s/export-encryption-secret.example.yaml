# Example secret for export encryption keys.
#
# Mount this as a file and point:
#   TSP_EXPORT_ENCRYPTION_KEYS_FILE=/etc/tsp/export-keys/keys.json
#   TSP_EXPORT_ENCRYPTION_KEY_ID=k2
#
# Replace the placeholder base64 values with 32-byte keys:
#   openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: export-encryption
  namespace: xingtu-tsp
type: Opaque
stringData:
  keys.json: |
    {"k2":"REPLACE_WITH_BASE64_32_BYTES","k1":"REPLACE_WITH_BASE64_32_BYTES"}
