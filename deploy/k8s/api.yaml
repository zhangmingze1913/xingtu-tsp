apiVersion: v1
kind: Service
metadata:
  name: tsp-api
  namespace: xingtu-tsp
  labels:
    app: tsp-api
spec:
  selector:
    app: tsp-api
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsp-api
  namespace: xingtu-tsp
  labels:
    app: tsp-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tsp-api
  template:
    metadata:
      labels:
        app: tsp-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/api/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: tsp-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tsp-api
      containers:
        - name: api
          image: xingtu-tsp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: raft
              containerPort: 7001
          envFrom:
            - configMapRef:
                name: tsp-config
          env:
            - name: TSP_DATABASE
              valueFrom:
                secretKeyRef:
                  name: tsp-secret
                  key: database-url
            - name: TSP_JWT_PRIVATE_KEY_FILE
              value: /etc/tsp/secret/jwt-private.pem
            - name: TSP_JWT_PUBLIC_KEY_FILE
              value: /etc/tsp/secret/jwt-public.pem
            - name: TSP_IGGY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tsp-secret
                  key: iggy-password
                  optional: true
            - name: TSP_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TSP_NODE_ROLE
              value: api
            - name: TSP_RUSTFS_ENDPOINT
              value: http://rustfs:9000
            - name: TSP_RUSTFS_BUCKET
              value: tsp-media
            - name: TSP_RUSTFS_REGION
              value: us-east-1
            - name: TSP_RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tsp-secret
                  key: rustfs-access-key
            - name: TSP_RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tsp-secret
                  key: rustfs-secret-key
            - name: TSP_RUSTFS_PREFIX
              value: media
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tsp-secret
              mountPath: /etc/tsp/secret
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tsp-secret
          secret:
            secretName: tsp-secret
            items:
              - key: jwt-private.pem
                path: jwt-private.pem
              - key: jwt-public.pem
                path: jwt-public.pem
              - key: jt808-cert.pem
                path: jt808-cert.pem
              - key: jt808-key.pem
                path: jt808-key.pem
