# Copy to secret.yaml, replace values, and NEVER commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: tsp-secret
  namespace: xingtu-tsp
type: Opaque
stringData:
  # PostgreSQL connection used by API and JT808 gateway pods.
  database-url: "postgres://tsp:CHANGE_ME_DB_PASSWORD@postgres:5432/tsp?sslmode=disable"
  # Generate with:
  #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
  #   openssl rsa -pubout -in jwt-private.pem -out jwt-public.pem
  #   openssl req -new -x509 -key jwt-private.pem -out jt808-cert.pem -days 825 -subj "/CN=tsp-jt808"
  jwt-private.pem: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME_RS256_PRIVATE_KEY
    -----END PRIVATE KEY-----
  jwt-public.pem: |
    -----BEGIN PUBLIC KEY-----
    CHANGE_ME_RS256_PUBLIC_KEY
    -----END PUBLIC KEY-----
  jt808-cert.pem: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME_JT808_CERTIFICATE
    -----END CERTIFICATE-----
  jt808-key.pem: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME_JT808_PRIVATE_KEY
    -----END PRIVATE KEY-----
  postgres-password: "CHANGE_ME_DB_PASSWORD"
  # Optional Iggy HTTP credentials (used when deploy/k8s/iggy.yaml + TSP_IGGY_URL are enabled)
  iggy-username: "iggy"
  iggy-password: "CHANGE_ME_IGGY_PASSWORD"
