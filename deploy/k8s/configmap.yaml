apiVersion: v1
kind: ConfigMap
metadata:
  name: tsp-config
  namespace: xingtu-tsp
data:
  TSP_BIND: "0.0.0.0:8090"
  TSP_JT808_ADDR: "0.0.0.0:18080"
  TSP_CLUSTER_MODE: "true"
  TSP_DEMO_MODE: "true"
  TSP_COMMAND_MODE: "simulated"
  TSP_POSTGIS_ENABLED: "true"
  # Set to production and disable demo/command simulation before real rollout.
  TSP_ENV: "development"
  TSP_CORS_ORIGINS: ""
  TSP_JWT_ACCESS_TTL_MINUTES: "15"
  TSP_JWT_REFRESH_TTL_HOURS: "168"
  TSP_JWT_KEY_ID: "tsp-rs256-1"
  # TSP_JWT_PREVIOUS_KEYS: "old-1=/etc/tsp/secret/jwt-old-1.pem"
  TSP_REDIS_ALLOW_PLAINTEXT: "false"
  TSP_JT808_ALLOW_PLAINTEXT: "false"
  # TSP_JT808_CLIENT_CA: "/etc/tsp/secret/jt808-client-ca.pem"
  # TSP_JT808_ALLOWED_CIDRS: "10.0.0.0/8,192.168.0.0/16"
  TSP_JT808_TLS_CERT: "/etc/tsp/secret/jt808-cert.pem"
  TSP_JT808_TLS_KEY: "/etc/tsp/secret/jt808-key.pem"
  TSP_JWT_PRIVATE_KEY_FILE: "/etc/tsp/secret/jwt-private.pem"
  TSP_JWT_PUBLIC_KEY_FILE: "/etc/tsp/secret/jwt-public.pem"
  RUST_LOG: "xingtu_tsp=info,tower_http=warn"
  # JT/T 1078 media UDP + RustFS archive (bucket auto-created on startup)
  TSP_MEDIA_UDP_ADDR: "0.0.0.0:19000"
  TSP_RUSTFS_ARCHIVE: "true"
  TSP_RUSTFS_ENDPOINT: "http://rustfs:9000"
  TSP_RUSTFS_BUCKET: "tsp-media"
  TSP_RUSTFS_REGION: "us-east-1"
  TSP_RUSTFS_PREFIX: "media"
  TSP_RUSTFS_SEGMENT_SECS: "30"
  TSP_RUSTFS_SEGMENT_MAX_BYTES: "67108864"
  TSP_RUSTFS_UPLOAD_RETRIES: "3"
  TSP_RUSTFS_UPLOAD_TIMEOUT_SECS: "30"
  TSP_RUSTFS_UPLOAD_CONCURRENCY: "4"
  TSP_RUSTFS_RETENTION_DAYS: "0"
  TSP_RUSTFS_CLEANUP_INTERVAL_SECS: "3600"
  TSP_ARCHIVE_PLAYBACK_CACHE_ITEMS: "8"
  TSP_ARCHIVE_PLAYBACK_CACHE_BYTES: "67108864"
  TSP_ARCHIVE_SPOOL_DIR: "/tmp/archive-spool"
  TSP_ARCHIVE_SPOOL_REPLAY_SECS: "60"
  TSP_ARCHIVE_SPOOL_MAX_BYTES: "1073741824"
  # Use a managed Redis or Redis Operator in production.
  TSP_REDIS_URL: "redis://redis:6379/0"
  # Optional Apache Iggy HTTP event log. Set the URL and apply iggy.yaml to enable.
  TSP_IGGY_URL: ""
  TSP_IGGY_STREAM: "xingtu-tsp"
  TSP_IGGY_TOPIC: "events"
  TSP_IGGY_USERNAME: "iggy"
  # Optional tsink time-series store (Prometheus-compatible HTTP)
  TSP_TSINK_URL: ""
  TSP_TSINK_TOKEN: ""
  # Time-series backend: postgres | tdengine | dual.
  # Set to tdengine/dual and set TSP_TDENGINE_URL after applying tdengine.yaml.
  TSP_TIMESERIES_BACKEND: "postgres"
  # Optional TDengine REST SQL (taosAdapter)
  TSP_TDENGINE_URL: ""
  TSP_TDENGINE_USER: "root"
  TSP_TDENGINE_PASSWORD: "taosdata"
  TSP_TDENGINE_DATABASE: "tsp"
  TSP_TDENGINE_QUEUE_CAPACITY: "8192"
  TSP_TDENGINE_WRITE_RETRIES: "3"
  TSP_TDENGINE_SPOOL_DIR: "/tmp/tdengine-spool"
  TSP_TDENGINE_SPOOL_MAX_FILES: "100000"
  TSP_TDENGINE_SPOOL_REPLAY_SECS: "60"
  TSP_TIMESERIES_RECONCILE_ENABLED: "true"
  TSP_TIMESERIES_RECONCILE_SECS: "300"
  TSP_TIMESERIES_RECONCILE_WINDOW_MINUTES: "15"
  TSP_TIMESERIES_RECONCILE_MAX_VEHICLES: "100"
  TSP_TIMESERIES_RECONCILE_HISTORY_DAYS: "90"
  TSP_RECONCILE_EXPORT_DIR: "/tmp/reconcile-exports"
  TSP_RECONCILE_ALERT_WEBHOOK: ""
  TSP_RECONCILE_ALERT_COOLDOWN_SECS: "300"
  TSP_RECONCILE_ALERT_COOLDOWN_SCOPE: "global"
  TSP_RECONCILE_ALERT_RETRIES: "2"
  TSP_RECONCILE_ALERT_FORMAT: "generic"
  TSP_RECONCILE_ALERT_MODE: "per_vehicle"
  # Optional Walrus durable event archive (length-prefixed TCP)
  TSP_WALRUS_ADDR: ""
  TSP_WALRUS_TOPIC: "tsp-events"
  # OpenRaft control plane (leave node id unset; derive unique id from TSP_NODE_ID)
  TSP_RAFT_ENABLED: "false"
  TSP_RAFT_ADDR: "0.0.0.0:7001"
  TSP_RAFT_PEERS: ""
  TSP_RAFT_BOOTSTRAP: "true"
