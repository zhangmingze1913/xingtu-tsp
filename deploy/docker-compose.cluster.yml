# Local cluster smoke test: 2 API instances, 2 JT808 gateways, PostgreSQL, Redis, Nginx.
# Production should use Kubernetes or a managed container platform.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tsp
      POSTGRES_USER: tsp
      POSTGRES_PASSWORD: tsp-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsp -d tsp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-a:
    build: ..
    image: xingtu-tsp:0.1.0
    environment: &api-env
      TSP_BIND: 0.0.0.0:8090
      TSP_JT808_ADDR: 0.0.0.0:18080
      TSP_DATABASE: postgres://tsp:tsp-dev-password@postgres:5432/tsp?sslmode=disable
      TSP_REDIS_URL: redis://redis:6379/0
      TSP_CLUSTER_MODE: "true"
      TSP_DEMO_MODE: "true"
      TSP_JWT_SECRET: local-cluster-secret-change-me
      TSP_NODE_ID: api-a
      TSP_NODE_ROLE: api
      TSP_MEDIA_UDP_ADDR: 0.0.0.0:19000
      TSP_RUSTFS_ARCHIVE: "true"
      TSP_RUSTFS_ENDPOINT: http://rustfs:9000
      TSP_RUSTFS_BUCKET: tsp-media
      TSP_RUSTFS_REGION: us-east-1
      TSP_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      TSP_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      TSP_RUSTFS_PREFIX: media
      TSP_RUSTFS_SEGMENT_SECS: "30"
      TSP_RUSTFS_SEGMENT_MAX_BYTES: "67108864"
      TSP_RUSTFS_UPLOAD_RETRIES: "3"
      TSP_RUSTFS_UPLOAD_TIMEOUT_SECS: "30"
      TSP_RUSTFS_UPLOAD_CONCURRENCY: "4"
      TSP_RUSTFS_RETENTION_DAYS: "0"
      TSP_RUSTFS_CLEANUP_INTERVAL_SECS: "3600"
      TSP_ARCHIVE_PLAYBACK_CACHE_ITEMS: "8"
      TSP_ARCHIVE_PLAYBACK_CACHE_BYTES: "67108864"
      RUST_LOG: xingtu_tsp=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-b:
    build: ..
    image: xingtu-tsp:0.1.0
    environment:
      <<: *api-env
      TSP_NODE_ID: api-b
    depends_on:
      - api-a
      - postgres
      - redis

  gateway-a:
    build: ..
    image: xingtu-tsp:0.1.0
    ports:
      - "19000:19000/udp"
    environment:
      <<: *api-env
      TSP_DEMO_MODE: "false"
      TSP_NODE_ID: gateway-a
      TSP_NODE_ROLE: gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  gateway-b:
    build: ..
    image: xingtu-tsp:0.1.0
    ports:
      - "19001:19000/udp"
    environment:
      <<: *api-env
      TSP_DEMO_MODE: "false"
      TSP_NODE_ID: gateway-b
      TSP_NODE_ROLE: gateway
    depends_on:
      - gateway-a
      - postgres
      - redis
      - rustfs

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
      - "18080:18080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-a
      - api-b
      - gateway-a
      - gateway-b

  # S3-compatible object storage for recorded 1078 media.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: xingtu-rustfs
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0,/data/rustfs1,/data/rustfs2,/data/rustfs3
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
      - rustfs-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  rustfs-permissions:
    image: alpine:3.20
    command: >
      sh -c "chown -R 10001:10001 /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3 /app/logs &&
      echo 'rustfs volume permissions ready'"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
      - rustfs-logs:/app/logs
    restart: "no"

volumes:
  pgdata:
  redisdata:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
  rustfs-logs:
