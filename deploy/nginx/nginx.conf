load_module /usr/lib/nginx/modules/ngx_stream_module.so;

events {
    worker_connections 4096;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream tsp_api {
        least_conn;
        server api-a:8090 max_fails=3 fail_timeout=10s;
        server api-b:8090 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 2m;

        location / {
            proxy_pass http://tsp_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}

stream {
    upstream tsp_jt808 {
        least_conn;
        server gateway-a:18080 max_fails=3 fail_timeout=10s;
        server gateway-b:18080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 18080;
        proxy_pass tsp_jt808;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
