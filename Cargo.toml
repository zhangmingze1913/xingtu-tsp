[package]
name = "xingtu-tsp"
version = "0.1.0"
edition = "2021"
description = "星途车联 - 车联网 TSP 运营平台（Rust/Axum/SQLx）"
license = "MIT"
default-run = "xingtu-tsp"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "sqlite", "postgres", "mysql"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sm4 = "0.5"
sm2 = { version = "0.13", features = ["std"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sm3 = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "tokio-native-tls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking", "http2"] }
base64 = "0.22"
encoding_rs = "0.8"
crc32fast = "1"
openraft = { version = "0.10", default-features = false, features = ["tokio-rt"] }
openraft-legacy = "0.10"
openraft-memstore = "0.10"
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
hmac = "0.12"
flate2 = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
ipnet = "2"
dotenvy = "0.15"
aws-sdk-s3 = "=1.65.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
